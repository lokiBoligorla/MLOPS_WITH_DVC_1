version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lokesh Boligorla", email = "lokeshboligorla77@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.67.1",
    "nltk>=3.10.4",
    "numpy>=2.4.6",
